<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { DEG, TAU, QUARTER } from './lib/s3-engine.js';

const qs = new URLSearchParams(location.search);
const RENDER = qs.has('render');
const W = +qs.get('w') || innerWidth, H = +qs.get('h') || innerHeight;
const DURATION = 31;
// ---------- IMAX scaling: the 16:9 cut is the reference; a taller frame keeps its horizontal field of view and
// gains picture top and bottom (IMAX 1.43:1 = 4096×2864). Everything measured in pixels scales with HREF, the
// height a 16:9 frame of the same width would have, so a 4K IMAX frame is the 1080p film with 2.1× the detail.
const REF_ASP = 16 / 9, ASP = W / H;
const WIDE = Math.max(1, REF_ASP / ASP);             // vertical field gain (1.243 at 1.43:1, 1 at 16:9)
const HREF = W / REF_ASP;                            // equivalent 16:9 height in pixels
const PXS = Math.max(1, W / 1920);                   // pixel scale vs the 1080p reference
const MATTE_ASP = 4096 / 2160;                       // IMAX digital 1.90:1, the letterbox inside the 1.43 frame
if (RENDER) document.body.classList.add('render');

// ---------- easing ----------
const clamp01 = x => Math.min(Math.max(x, 0), 1);
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
const smoother = u => u * u * u * (u * (u * 6 - 15) + 10);
const lerp = (a, b, u) => a + (b - a) * u;
const logLerp = (a, b, u) => a * Math.pow(b / a, u);

// Head = the FIRST version: a dense coil on the Clifford torus (α = π/4), 2 turns round, 41 through the tube.
const HEAD = { a0: 1, n: 2, k: 41, amax: 0.82, tw: 0.07, eps: 0.01, tang: 0, curl: -80, pin: 1 };
const N = 9000, SC = 0.75, IC = Math.round(SC * N);
const K = 14;                                         // tendril strands in the tail bundle

/**
 * One frame of the creature on S³.
 *  - main curve: the nine (sunburst head + pinned stem). Live offsets are weighted by free = 1 − pin,
 *    so the coils spin/circulate/breathe at full strength while the stem stays aimed at the 4D pole.
 *  - tendrils: K strands braided round the pinned stem, offset in θ and φ ON S³. Near the pole the
 *    projection magnifies offsets by 1/(1−w), so the bundle splays into claws at the tip by itself.
 */
function buildCreature(P, L) {
  const x = new Float32Array(N), y = new Float32Array(N), z = new Float32Array(N), w = new Float32Array(N);
  const n = Math.round(P.n), k = Math.round(P.k);
  const aMax = P.amax * Math.PI / 2, a0 = P.a0 * QUARTER, curl = P.curl * DEG;
  const env = (d, wd) => { const u = d / wd; return Math.exp(-u * u); };
  const B = new Float32Array(N), D = new Float32Array(N), G = new Float64Array(N + 1);
  for (let i = 0; i < N; i++) {
    let d = Math.abs(i / N - SC); d = Math.min(d, 1 - d);
    D[i] = d; B[i] = env(d, P.tw);
    G[i + 1] = G[i] + (1 - (1 - P.eps) * env(d, P.tw * 1.9));
  }
  const Gtot = G[N];
  const W2 = Math.min(3.5 * P.tw, 0.24), W1 = Math.min(2 * P.tw, 0.75 * W2);
  const A = new Float32Array(N), TH = new Float32Array(N), PH = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const s = i / N, d = D[i], b = B[i];
    const pin = P.pin * (d <= W1 ? 1 : d >= W2 ? 0 : Math.cos(Math.PI / 2 * (d - W1) / (W2 - W1)) ** 2);
    const free = 1 - pin;
    const dG = (G[i] - G[IC]) / Gtot;
    const breathe = 1 + free * (L.breathA * Math.sin(TAU * L.breathK * s - L.breathW * L.t)
                              + 0.025 * Math.sin(TAU * 31 * s + 23 * L.t));
    const a = a0 * breathe + (Math.max(aMax, a0) - a0) * b;
    const whip = L.whipA * b * b * Math.sin(L.whipK * b - L.whipW * L.t);
    const th = P.tang * DEG + TAU * n * dG * free + curl * b + L.thFlow * free + whip;
    const ph = Math.PI / 2 + TAU * k * dG * free + L.phFlow * free;
    A[i] = a; TH[i] = th; PH[i] = ph;
    const ca = Math.cos(a), sa = Math.sin(a);
    x[i] = ca * Math.cos(th); y[i] = ca * Math.sin(th); z[i] = sa * Math.cos(ph); w[i] = sa * Math.sin(ph);
  }
  // tendrils follow the outgoing half of the pinned stem (root at d = W1, tip at the peak)
  const i0 = IC - Math.round(W1 * N), M = Math.floor((IC - i0) / 2) + 1;
  const T = new Float32Array(K * M * 4), U = new Float32Array(K * M);
  for (let j = 0; j < K; j++) for (let m = 0; m < M; m++) {
    const i = Math.min(i0 + 2 * m, IC), u = (B[i] - B[i0]) / (1 - B[i0]);          // 0 root → 1 tip
    const thorn = 1 + 2.2 * Math.max(0, Math.sin(TAU * 6 * u - 6.5 * L.t + j * 1.7)) ** 10;
    const claw = 1 + 1.6 * smooth(clamp01((u - 0.72) / 0.28));                      // tip splays into claws
    const root = smooth(clamp01((u - 0.0) / 0.14));
    const chi = TAU * j / K + 2.6 * TAU * u - 3.2 * L.t + 0.55 * Math.sin(4 * Math.PI * u - 2.3 * L.t + j);
    const rTh = L.tendril * 0.17 * (1 - 0.55 * u) * thorn * claw * root * (0.75 + 0.25 * Math.sin(j * 2.3));
    const rPh = L.tendril * 0.09 * (1 - 0.9 * u) * thorn * root;                     // depth tapers
    const a = A[i], th = TH[i] + rTh * Math.cos(chi), ph = PH[i] + rPh * Math.sin(chi);
    const ca = Math.cos(a), sa = Math.sin(a), o = (j * M + m) * 4;
    T[o] = ca * Math.cos(th); T[o + 1] = ca * Math.sin(th); T[o + 2] = sa * Math.cos(ph); T[o + 3] = sa * Math.sin(ph);
    U[j * M + m] = u;
  }
  return { x, y, z, w, B, T, U, M };
}

// =====================================================================================================
// EXACT 4D ALGEBRA
// A point of S³ is a unit quaternion p = x + y·i + z·j + w·k. Every rotation of S³ is p ↦ q_L · p · q_R
// for a pair of unit quaternions (SO(4) ≅ S³×S³/±1), and every conformal map of S³ is such a rotation
// composed with a Lorentz boost of the light cone in ℝ⁴'¹ (SO(4,1)). Nothing below is an ad-hoc angle mix.
// =====================================================================================================
const qmul = (a, b) => [
  a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
  a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
  a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
  a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
const qexp = (th, u) => { const s = Math.sin(th); return [Math.cos(th), s * u[0], s * u[1], s * u[2]]; };   // e^{θu}, |u| = 1, u ⟂ 1
const unit3 = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
function qslerp(a, b, u) {                                   // geodesic on S³ (no sign flip: endpoints are chosen jointly)
  const d = Math.min(1, Math.max(-1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]));
  const om = Math.acos(d), s = Math.sin(om);
  if (s < 1e-6) return a.map((c, i) => lerp(c, b[i], u));
  const ka = Math.sin((1 - u) * om) / s, kb = Math.sin(u * om) / s;
  return a.map((c, i) => ka * c + kb * b[i]);
}
const ONE = [1, 0, 0, 0], PHI = (1 + Math.sqrt(5)) / 2;

/** The group element as a 4×4 matrix (images of 1, i, j, k) + a boost of rapidity η towards the point n ∈ S³. */
function makeG(L, R, eta = 0, n = [0, 0, 0, 1]) {
  const m = new Float64Array(16);
  for (let c = 0; c < 4; c++) {
    const e = [0, 0, 0, 0]; e[c] = 1;
    const v = qmul(qmul(L, e), R);
    for (let r = 0; r < 4; r++) m[4 * r + c] = v[r];
  }
  return { m, L, R, eta, n, ch: Math.cosh(eta), sh: Math.sinh(eta) };
}
const compose = (A, B) => makeG(qmul(A.L, B.L), qmul(B.R, A.R), A.eta, A.n);   // A∘B (B's boost is dropped: drifts have none)

/**
 * Rotate, boost, then stereographically project from the pole k:  σ(p) = (x, y, z) / (1 − w).
 * Boost (exact, stays on S³):  p ↦ ( p + ((cosh η − 1)(p·n) + sinh η) n ) / (cosh η + sinh η (p·n)).
 * Points flow from −n to n; with n = k it is a pure zoom by e^η on screen.
 */
function proj(x, y, z, w, G, out, o) {
  const m = G.m;
  let X = m[0] * x + m[1] * y + m[2] * z + m[3] * w;
  let Y = m[4] * x + m[5] * y + m[6] * z + m[7] * w;
  let Z = m[8] * x + m[9] * y + m[10] * z + m[11] * w;
  let Q = m[12] * x + m[13] * y + m[14] * z + m[15] * w;
  if (G.sh !== 0) {
    const n = G.n, s = X * n[0] + Y * n[1] + Z * n[2] + Q * n[3];
    const k = (G.ch - 1) * s + G.sh, T = G.ch + G.sh * s;
    X = (X + k * n[0]) / T; Y = (Y + k * n[1]) / T; Z = (Z + k * n[2]) / T; Q = (Q + k * n[3]) / T;
  }
  const d = Math.max(1 - Q, 1e-5);
  out[o] = X / d; out[o + 1] = Y / d; out[o + 2] = Z / d;
  return Q;
}

/**
 * TIMELINE (every visual is a pure function of t)
 *  0–9    a faraway sunburst nine fades in, dolly in                9–12  the creature, a 10° isoclinic breath
 * 12.2–16.4  I   HOPF FLOW: q_L = e^{θu}, θ: 0 → 2π. Every point runs once round its Hopf fibre; at θ = π the
 *              nine is its own antipode −p (inside out). The trails are exact fibre arcs → the nine's Hopf torus.
 * 16.4–24.9  II  DOUBLE ROTATION: q_L = e^{ω t u_L}, q_R = e^{(ω/φ) t u_R}. Golden ratio ⇒ the orbit never closes.
 * 21.0–24.8  III CONFORMAL BOOST (SO(4,1)): sink swings from the pole (zoom) to the side (everything pours into it)
 * 24.0–25.6  IV  GEODESIC RETURN: slerp (q_L, q_R) → ±(1, 1) on S³×S³, η → 0, the nine snaps back
 * 25.6–31    title lockup (as v5, +2 s); the 4D tail-whip is the exact zw rotation (e^{iα/2}, e^{−iα/2})
 */
const T_HOPF0 = 12.2, T_HOPF1 = 16.4, T_DBL = 16.4, T_BST0 = 21.0, T_BST1 = 24.8, T_RET0 = 24.0, T_FREEZE = 24.9;
const U_BREATH = unit3([0.3, 1, 0.2]), U_HOPF = unit3([0.25, 1, 0.55]);
const U_L = unit3([0.6, 0.2, 1]), U_R = unit3([1, -0.7, 0.35]), N_SIDE = unit3([0.8, -0.35, 0.45]);
const OMEGA = 1.05;
function rawGroup(t) {
  const beta = 10 * DEG * Math.sin(Math.PI * smoother(seg(t, 9.3, 12.3)));
  const thH = TAU * smoother(seg(t, T_HOPF0, T_HOPF1));
  const d = Math.max(0, Math.min(t, T_FREEZE) - T_DBL), tau = d < 1.2 ? d * d / 2.4 : d - 0.6;   // C¹ spin-up
  const thL = OMEGA * tau, thR = thL / PHI;
  const L = qmul(qexp(thL, U_L), qmul(qexp(thH, U_HOPF), qexp(beta, U_BREATH)));
  const R = qexp(thR, U_R);
  const eta = 1.55 * Math.sin(Math.PI * seg(t, T_BST0, T_BST1)) ** 2;
  const psi = lerp(15, 110, smooth(seg(t, T_BST0, T_BST1))) * DEG;          // sink: from the pole k towards the side
  const n = [Math.sin(psi) * N_SIDE[0], Math.sin(psi) * N_SIDE[1], Math.sin(psi) * N_SIDE[2], Math.cos(psi)];
  return { L, R, eta, n, thH, thL, thR, psi };
}
// (L, R) and (−L, −R) are the same rotation: pick the nearer identity once, so the return is the shorter geodesic
const SIGN = (() => { const g = rawGroup(T_FREEZE); return Math.acos(g.L[0]) + Math.acos(g.R[0]) <= Math.PI ? 1 : -1; })();

function shotMess(t) {
  const u = smoother(seg(t, 16.4, 23.5));
  const strike = Math.max(0, Math.sin(1.25 * t - 0.6)) ** 5;      // periodic lunge
  const P = {
    ...HEAD,
    pin:  lerp(1, 0, smooth(seg(t, 16.4, 19.4))),
    curl: lerp(HEAD.curl + 16 * strike, HEAD.curl - 1260, u),
    eps:  lerp(HEAD.eps, 0.18, u),
    amax: lerp(HEAD.amax + 0.035 * strike, 0.95, smooth(seg(t, 17.4, 22.4))),
  };
  const dolly = t < 9 ? logLerp(420, 19, smoother(seg(t, 2, 9))) : lerp(19, 17.8, smooth(seg(t, 9, 12)));
  const dist = t < 12 ? dolly : lerp(17.8, 23, smooth(seg(t, 12, 15))) - 1.2 * smooth(seg(t, 19, 24));
  const reveal = smoother(seg(t, 1.5, 9.4));
  const orbit = (-62 * (1 - reveal) + 42 * Math.sin(Math.PI * seg(t, 9.6, 13)) + lerp(0, 70, smooth(seg(t, 13, 25)))) * DEG;
  const elev = (26 * (1 - reveal) - 24 * Math.sin(Math.PI * seg(t, 9.6, 13)) + 28 * Math.sin(Math.PI * seg(t, 13, 24))) * DEG;
  const fade = smooth(seg(t, 0, 1.5));
  const bloom = 1.0 + 0.2 * Math.sin(t * 2.1) + 0.35 * strike - 0.5 * u - 0.4 * Math.sin(Math.PI * seg(t, 12.2, 16.8));
  const alpha = lerp(1, 0.42, smooth(seg(t, 17, 21)));
  const L = {
    t, phFlow: t * 2.6, thFlow: t * 0.35,
    breathA: 0.06, breathK: 6, breathW: 5.5,
    whipA: 9 * DEG, whipK: 10, whipW: 7.5,
    tendril: 1 + 0.35 * strike,
  };
  // trail = exact past orbit of each point; long during the Hopf flow (→ fibres), shorter in the double rotation
  const trail = 3.2 * smooth(seg(t, 12.2, 13.6)) - 1.8 * smooth(seg(t, 16, 17.5)) - 0.4 * smooth(seg(t, 21, 22.5)) - 1.0 * smooth(seg(t, 24, 25.2));
  return { P, dist, orbit, elev, lat: { glow: 1 }, fade, spread: lerp(0.04, 1, smoother(seg(t, 2.5, 9.5))), bloom, alpha, L, strike, trail: Math.max(0, trail),
           tendrilFade: 1 - smooth(seg(t, 19.5, 22.5)) };
}

/**
 * FINAL (24–31): the mess implodes back into the nine on the LEFT, "UNKNOWN" burns in on its RIGHT,
 * then the two trade places (the nine whips its tail through the 4th dimension while it crosses) so the
 * lockup reads "UNKNOWN 9", and "COMING SOON" + the credit flicker on underneath.
 */
const H1 = n => { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); };
const pulse = (t, c, w) => Math.exp(-(((t - c) / w) ** 2));
const T_SNAP = 25.6, T_SWAP0 = 26.8, T_SWAP1 = 27.75, T_CRED = 28.9, T_END = 30.8;
const NINE_X0 = -0.50, NINE_X1 = 0.55;            // screen x (NDC) of the nine: left of the word, then right
const UNK_X0 = 0.30, UNK_X1 = -0.26;               // screen x of "UNKNOWN": right of the nine, then left
const TAN = Math.tan(20 * DEG) * WIDE;              // half-height of the view at unit distance (40° vertical FOV at 16:9)
const I3 = [1, 0, 0];

/** the exact group element at time t (pure) */
function groupAt(t) {
  const g = rawGroup(t);
  const r = smoother(seg(t, T_RET0, T_SNAP));
  let L = g.L, R = g.R, eta = g.eta;
  if (r > 0) { const id = [SIGN, 0, 0, 0]; L = qslerp(L, id, r); R = qslerp(R, id, r); eta *= 1 - r; }
  const al = TAU * smoother(seg(t, T_SWAP0, T_SWAP1));          // zw rotation by α = (e^{iα/2}, e^{−iα/2})
  if (al > 0) { L = qmul(qexp(al / 2, I3), L); R = qmul(R, qexp(-al / 2, I3)); }
  const G = makeG(L, R, eta, g.n);
  G.info = { ...g, r, eta };
  return G;
}

function shot(t) {
  const s = shotMess(t);
  s.nx = 0; s.shake = 0; s.title = null;
  const r = smoother(seg(t, T_RET0, T_SNAP));
  if (r <= 0) return s;
  const k = s.strike, P = s.P;
  P.pin  = lerp(P.pin, 1, r);
  P.curl = lerp(P.curl, HEAD.curl + 16 * k, r);
  P.eps  = lerp(P.eps, HEAD.eps, r);
  P.amax = lerp(P.amax, HEAD.amax + 0.035 * k, r);
  const sw = smoother(seg(t, T_SWAP0, T_SWAP1));
  s.dist  = lerp(s.dist, lerp(26.5, 24.6, smooth(seg(t, T_SNAP, DURATION))), r);
  s.orbit = lerp(s.orbit, 0, r) + 9 * DEG * Math.sin(0.9 * (t - T_SNAP)) * smooth(seg(t, T_SNAP, T_SNAP + 1.4)) * (1 - 0.6 * sw);
  s.elev  = lerp(s.elev, 0, r) + 4 * DEG * Math.sin(0.7 * (t - T_SNAP)) * smooth(seg(t, T_SNAP, T_SNAP + 1.4));
  s.lat.glow = 1 - 0.55 * smooth(seg(t, 25.3, 26.4));
  s.nx    = lerp(0, NINE_X0, r) + (NINE_X1 - NINE_X0) * sw;
  s.alpha = lerp(s.alpha, 1, r);
  s.tendrilFade = lerp(s.tendrilFade, 1, r);
  s.bloom = lerp(s.bloom, 1.05 + 0.2 * Math.sin(t * 2.1) + 0.35 * k, r)
          + 1.6 * pulse(t, T_SNAP, 0.09) + 1.1 * pulse(t, T_SWAP1, 0.09) + 0.8 * pulse(t, T_END, 0.07);
  if (t > T_SWAP1 + 0.3) s.bloom = Math.min(s.bloom, 1.4 + 0.8 * pulse(t, T_END, 0.07));   // keep the lockup legible on lunges
  s.fade *= 1 - smooth(seg(t, T_END + 0.05, DURATION));        // hit, then cut to black
  s.shake = 0.35 * pulse(t, T_SNAP + 0.05, 0.16) + 0.22 * pulse(t, T_SWAP1 + 0.04, 0.13) + 0.3 * pulse(t, T_END, 0.12);
  const spike = t > 26.5 && H1(Math.floor(t * 9) * 7.7) > 0.86 ? 0.55 : 0;   // stray glitch hits
  const soonOn = smooth(seg(t, 27.6, 28.35)), credOn = smooth(seg(t, 28.5, 29.3));
  const endHit = pulse(t, T_END, 0.12);
  s.title = {
    unk: { reveal: smooth(seg(t, 25.35, 26.55)), x: lerp(UNK_X0, UNK_X1, sw), beat: 1 + 0.35 * k,
           glitch: Math.min(1.2, 0.12 + 0.9 * (1 - smooth(seg(t, 25.35, 26.7))) + 0.8 * pulse(t, (T_SWAP0 + T_SWAP1) / 2, 0.22)
                              + 0.8 * pulse(t, T_SWAP1, 0.07) + spike + 0.5 * pulse(t, T_CRED, 0.08) + 1.1 * endHit) },
    soon: { reveal: soonOn, beat: H1(Math.floor(t * 22) * 3.3) < soonOn * 1.15 ? 1 : 0.12, glitch: 0.1 + 0.6 * (1 - soonOn) + spike * 0.6 + endHit },
    cred: { reveal: credOn, beat: H1(Math.floor(t * 19) * 5.1 + 2) < credOn * 1.15 ? 1 : 0.1, glitch: 0.1 + 0.7 * (1 - credOn) + spike * 0.6 + endHit },
    embers: smooth(seg(t, 25.4, 26.4)),
  };
  return s;
}

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(2 * Math.atan(TAN) / DEG, W / H, 0.01, 8000);
const TARGET = new THREE.Vector3(1.6, -2.7, 0);
const NINE_OFS_X = -0.08;                               // screen x (NDC) of the nine's centre when the camera looks at TARGET

const HASH = `float hash(float n){ return fract(sin(n)*43758.5453); }`;
const VERT = `attribute float aW, aS, aB; uniform float uClip, uSize, uPix, uT, uFocus; varying float vW, vFade, vS, vSpark, vB, vDG;
  ${HASH}
  void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv;
    vFade = 1. - smoothstep(uClip*.45, uClip, length(position)); vW = aW; vS = aS; vB = aB;
    vDG = clamp(1. + (uFocus + mv.z)*.11, .35, 1.8);          // nearer = hotter: depth reads even head-on

      float x = mix(-1.05, 1.05, aSeed.x) + .05*sin(uT*(1.3 + aSeed.z*2.) + aSeed.y*40.);
      float y = -.85 + life*1.75 + .03*sin(uT*3. + aSeed.x*50.);
      vLife = life; vK = aSeed.z;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(x*uHH*uAsp, y*uHH, -${TD.toFixed(1)}, 1.);
      gl_PointSize = uPix*(1.5 + 4.5*aSeed.z*aSeed.z); }`,
  fragmentShader: `uniform float uA, uT; varying float vLife, vK;
    void main(){ float r = length(gl_PointCoord - .5); if (r > .5) discard;
      float f = sin(3.1416*vLife) * (.6 + .4*sin(uT*17. + vK*90.));
      gl_FragColor = vec4(mix(vec3(.08, .55, 1.), vec3(.85, .95, 1.), vK) * exp(-r*r*14.) * f * uA, 1.); }`,
});
const embers = new THREE.Points(eGeo, emberMat);
embers.frustumCulled = false; embers.renderOrder = 9; camera.add(embers);

// ---------- exact orbit trails: each sample point drawn at g(t − τ)·p for τ ∈ [0, Λ] ----------
// During the pure Hopf flow g(t − τ)·p = e^{−(Δθ)u} e^{θu} p, i.e. an arc of the Hopf fibre through p, so the
// trails ARE fibres: Villarceau circles, every pair linked once. Their union over the nine is its Hopf torus.
const TR = 240, TS = 96, trPos = new Float32Array(TR * (TS - 1) * 2 * 3);
const trAge = new Float32Array(TR * (TS - 1) * 2), trS = new Float32Array(TR * (TS - 1) * 2), trW = new Float32Array(TR * (TS - 1) * 2);
const trGeo = new THREE.BufferGeometry();
trGeo.setAttribute('position', new THREE.BufferAttribute(trPos, 3));
trGeo.setAttribute('aAge', new THREE.BufferAttribute(trAge, 1));
trGeo.setAttribute('aS', new THREE.BufferAttribute(trS, 1));
trGeo.setAttribute('aW', new THREE.BufferAttribute(trW, 1));
const trMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uClip: { value: 42 }, uFocus: { value: 20 }, uA: { value: 0 }, uT: { value: 0 } },
  vertexShader: `attribute float aAge, aS, aW; uniform float uClip, uFocus; varying float vAge, vS, vW, vFade, vDG;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv;
      vFade = 1. - smoothstep(uClip*.4, uClip, length(position)); vAge = aAge; vS = aS; vW = aW;
      vDG = clamp(1. + (uFocus + mv.z)*.11, .3, 1.8); }`,
  fragmentShader: `uniform float uA, uT; varying float vAge, vS, vW, vFade, vDG;
    void main(){
      vec3 cyan = vec3(.05,.85,1.), violet = vec3(.4,.15,1.), gold = vec3(1.,.15,.75);   // the 'gold' family is magenta in v8
      vec3 c = mix(cyan, violet, vAge);
      c = mix(c, gold, .45*smoothstep(.55, 1., .5+.5*sin(6.2832*vS*3. + uT*.8)));       // three fibre families glow gold
      c += vec3(1.)*pow(1. - vAge, 6.)*.8;                                               // white-hot heads
      gl_FragColor = vec4(c*vDG*(.6 + .5*max(vW, 0.)), uA*vFade*pow(1. - vAge, 1.4)); }`,
});
const trails = new THREE.LineSegments(trGeo, trMat);
trails.frustumCulled = false;
scene.add(trails);
const trBody = new Float32Array(TR * 4), trTmp = new Float32Array(TS * 4);
function updateTrails(c, t, span) {
  for (let j = 0; j < TR; j++) {
    const i = Math.floor((j + 0.5) * N / TR);
    trBody[4 * j] = c.x[i]; trBody[4 * j + 1] = c.y[i]; trBody[4 * j + 2] = c.z[i]; trBody[4 * j + 3] = c.w[i];
  }
  const Gs = [];
  for (let q = 0; q < TS; q++) Gs.push(groupAt(t - span * q / (TS - 1)));
  const P3 = new Float32Array(TS * 3), PW = new Float32Array(TS);
  let v = 0;
  for (let j = 0; j < TR; j++) {
    const b = 4 * j;
    for (let q = 0; q < TS; q++) PW[q] = proj(trBody[b], trBody[b + 1], trBody[b + 2], trBody[b + 3], Gs[q], P3, 3 * q);
    for (let q = 0; q < TS - 1; q++) for (const qq of [q, q + 1]) {
      trPos[3 * v] = P3[3 * qq]; trPos[3 * v + 1] = P3[3 * qq + 1]; trPos[3 * v + 2] = P3[3 * qq + 2];
      trAge[v] = qq / (TS - 1); trS[v] = j / TR; trW[v] = PW[qq]; v++;
    }
  }
  cutLong(trPos, v, 7);
  for (const k of ['position', 'aAge', 'aS', 'aW']) trGeo.attributes[k].needsUpdate = true;
}

// ---------- math HUD: the live parameters of the transformation being applied ----------
const hudCv = document.createElement('canvas'); hudCv.width = 1800; hudCv.height = 150;
const hudCx = hudCv.getContext('2d'), hudTex = new THREE.CanvasTexture(hudCv);
hudTex.minFilter = THREE.LinearFilter; hudTex.generateMipmaps = false;
const hudMat = new THREE.ShaderMaterial({ transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTex: { value: hudTex }, uA: { value: 0 } },
  vertexShader: TITLE_VERT,
  fragmentShader: `uniform sampler2D uTex; uniform float uA; varying vec2 vUv;
    void main(){ vec4 c = texture2D(uTex, vUv); gl_FragColor = vec4(c.rgb*uA, 1.); }` });
const hud = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), hudMat);
hud.renderOrder = 11; hud.frustumCulled = false; camera.add(hud);
let hudLast = '';
const f3 = x => (x >= 0 ? ' ' : '') + x.toFixed(3);
function hudText(t, info) {
  const win = (a, b) => smooth(seg(t, a, a + 0.5)) * (1 - smooth(seg(t, b - 0.5, b)));
  const rows = [
    [win(2.6, 8.8),   'S³ ⊂ ℝ⁴ · STEREOGRAPHIC', 'x² + y² + z² + w² = 1      σ(p) = (x, y, z) / (1 − w)'],
    [win(12.0, 16.7), 'I · HOPF FLOW', `p ↦ e^{θu} p      θ = ${f3(info.thH)} rad      fibres = great circles, pairwise linked`],
    [win(16.5, 21.3), 'II · DOUBLE ROTATION  SO(4) ≅ S³×S³/±1', `p ↦ q_L p q_R      θ_L = ${f3(info.thL)}   θ_R = ${f3(info.thR)}   ω_R/ω_L = 1/φ  (never closes)`],
    [win(21.2, 24.3), 'III · CONFORMAL BOOST  SO(4,1)', `p ↦ (p + ((cosh η−1) p·n + sinh η) n) / (cosh η + sinh η p·n)      η = ${f3(info.eta)}   ψ = ${(info.psi / DEG).toFixed(1)}°`],
    [win(24.2, 25.7), 'IV · GEODESIC RETURN', `slerp (q_L, q_R) → ±(1, 1) on S³×S³      ${(100 * info.r).toFixed(1)} %`],
  ];
  let best = rows[0];
  for (const r of rows) if (r[0] > best[0]) best = r;
  return best;
}
const SHOW_HUD = false;                                // math caption off (user: no bottom-left text)
function updateHud(t, info, fade) {
  if (!SHOW_HUD) { hud.visible = false; return; }
  const [a, head, body] = hudText(t, info);
  hud.visible = a > 0.002;
  if (!hud.visible) return;
  const key = head + body;
  if (key !== hudLast) {
    hudLast = key;
    hudCx.clearRect(0, 0, hudCv.width, hudCv.height);
    hudCx.fillStyle = '#ffb070'; hudCx.font = '700 44px Cinzel, serif';
    if ('letterSpacing' in hudCx) hudCx.letterSpacing = '6px';
    hudCx.fillText(head, 8, 52);
    hudCx.fillStyle = '#8fdcff'; hudCx.font = '30px Consolas, "Cascadia Mono", monospace';
    if ('letterSpacing' in hudCx) hudCx.letterSpacing = '0px';
    hudCx.fillText(body, 8, 112);
    hudTex.needsUpdate = true;
  }
  const hN = 0.16, asp = hudCv.width / hudCv.height, wW = hN * HH * asp;
  hud.scale.set(wW, hN * HH, 1);
  hud.position.set(-0.93 * HH * camera.aspect + wW / 2, -0.83 * HH, -TD);
  hudMat.uniforms.uA.value = 0.42 * a * fade;
}

// ---------- render one exact moment ----------
function renderAt(t) {
  const s = shot(t);
  const R = groupAt(t);
  const c = buildCreature(s.P, s.L);
  for (let i = 0; i < N; i++) { wA[i] = proj(c.x[i], c.y[i], c.z[i], c.w[i], R, pos, 3 * i); bA[i] = c.B[i] * s.P.pin; }
  geo.attributes.position.needsUpdate = geo.attributes.aW.needsUpdate = geo.attributes.aB.needsUpdate = true;
  let v = 0;
  for (let j = 0; j < K; j++) for (let m = 0; m < TM - 1; m++) for (const mm of [m, m + 1]) {
    const o = (j * TM + mm) * 4;
    proj(c.T[o], c.T[o + 1], c.T[o + 2], c.T[o + 3], R, tPos, 3 * v);
    tU[v] = c.U[j * TM + mm]; tJ[v] = j; v++;
  }
  tGeo.attributes.position.needsUpdate = tGeo.attributes.aU.needsUpdate = tGeo.attributes.aJ.needsUpdate = true;
  for (const m of [lineMat, ptsMat, tMat, beadMat]) m.uniforms.uT.value = t;
  const dens = t < 9.5 ? Math.min(1, Math.max(0.22, Math.pow(19 / s.dist, 0.45))) : 1;   // 9000 points in a few pixels: dim by size
  lineMat.uniforms.uFade.value = s.fade * s.alpha * dens * PXS;   // 1-px lines: same light per area at 4K
  ptsMat.uniforms.uFade.value = s.fade * s.alpha * s.alpha * dens * dens;
  tMat.uniforms.uFade.value = s.fade * s.tendrilFade * dens * PXS;
  beadMat.uniforms.uFade.value = s.fade * s.tendrilFade * dens;
  tendrils.visible = beads.visible = s.tendrilFade > 0.001;
  starMat.opacity = s.fade;
  bloom.strength = s.bloom;
  // glow follows the shape: while the nine is small, the coarse bloom mips (1/16, 1/32 res) would smear it into
  // a blocky square, so they open up only as the camera closes in; far away the light starts as a dot
  const bf = bloom.compositeMaterial.uniforms.bloomFactors.value, BF = [1, 0.85, 0.6, 0.3, 0.1], sp = s.spread ?? 1;   // coarse mips kept low all film: the halo hugs the outline
  for (let i = 0; i < 5; i++) bf[i] = BF[i] * (i === 0 ? 1 : i === 1 ? 0.3 + 0.7 * sp : sp);
  // pan sideways so the nine lands at screen x = s.nx, plus a deterministic impact shake
  const pan = -(s.nx - NINE_OFS_X) * TAN * s.dist * camera.aspect;
  const jx = s.shake * (Math.sin(t * 91.7) + 0.6 * Math.sin(t * 57.3)), jy = s.shake * (Math.cos(t * 83.1) + 0.6 * Math.sin(t * 61.9));
  const rx = Math.cos(s.orbit), rz = -Math.sin(s.orbit);
  const ce = Math.cos(s.elev), se = Math.sin(s.elev);
  camera.position.set(TARGET.x + pan * rx + s.dist * ce * Math.sin(s.orbit) + jx, TARGET.y + s.dist * se + jy,
                      TARGET.z + pan * rz + s.dist * ce * Math.cos(s.orbit));
  const focus = Math.hypot(s.dist, pan);
  for (const m of [lineMat, ptsMat, tMat, beadMat, latMat, trMat]) m.uniforms.uFocus.value = focus;
  // the nested tori ride the same exact motion composed with their own slow (non-isoclinic) drift
  const drift = makeG(qexp(0.17 * t, unit3([0.4, 1, 0.3])), qexp(0.11 * t + 0.4, unit3([1, 0.2, -0.6])));
  updateLattice(R, compose(R, drift), 1);
  trails.visible = s.trail > 0.02;
  if (trails.visible) updateTrails(c, t, s.trail);
  trMat.uniforms.uT.value = t;
  trMat.uniforms.uA.value = 0.11 * PXS * s.fade * smooth(clamp01(s.trail / 0.6));
  updateHud(t, R.info, s.fade);
  latMat.uniforms.uT.value = t;
  latMat.uniforms.uA.value = 0.042 * PXS * s.fade * s.lat.glow;
  camera.lookAt(TARGET.x + pan * rx + 0.5 * jx, TARGET.y + 0.5 * jy, TARGET.z + pan * rz);
  const ti = s.title;
  unkT.mesh.visible = soonT.mesh.visible = credT.mesh.visible = embers.visible = !!ti;
  if (ti) {
    placeText(unkT, ti.unk.x, 0.02, 0.19);
    placeText(soonT, ti.unk.x, -0.2, 0.042);
    placeText(credT, ti.unk.x, -0.31, 0.03);
    for (const [tp, o] of [[unkT, ti.unk], [soonT, ti.soon], [credT, ti.cred]]) {
      tp.mat.uniforms.uT.value = t; tp.mat.uniforms.uReveal.value = o.reveal;
      tp.mat.uniforms.uGlitch.value = o.glitch; tp.mat.uniforms.uBeat.value = o.beat * s.fade;
    }
    emberMat.uniforms.uT.value = t; emberMat.uniforms.uA.value = ti.embers * s.fade;
  }
  matte.uniforms.uVis.value = ASP < REF_ASP ? Math.min(1, (W / imaxMatte(t)) / H) : 1;
  driveHolo(t, s);
  composer.render();
}
/** the swirl clock shared with the score (tools/score.py --future): 0.35 > 7 rev/s, exponential, 16 > 24 s */
const SW0 = 16, SW1 = 24, SWR0 = 0.35, SWK = Math.log(20) / (SW1 - SW0);
function swirlPhase(t) {                               // revolutions since 16 s (keeps accelerating until the freeze)
  const x = Math.min(Math.max(t, SW0), T_FREEZE) - SW0;
  return SWR0 / SWK * (Math.exp(SWK * x) - 1);
}
const _v = new THREE.Vector3(), _dist = new Float32Array(Math.ceil(N / 10));
function driveHolo(t, s) {
  camera.updateMatrixWorld();
  let sx = 0, sy = 0, n = 0;
  for (let i = 0; i < N; i += 10) {
    _v.set(pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]).project(camera);
    if (Math.abs(_v.x) > 1.3 || Math.abs(_v.y) > 1.3 || _v.z > 1) continue;
    sx += _v.x; sy += _v.y; n++;
  }
  const cx = n ? sx / n : 0, cy = n ? sy / n : 0;
  let k = 0;
  for (let i = 0; i < N; i += 10) {
    _v.set(pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]).project(camera);
    if (Math.abs(_v.x) > 1.3 || Math.abs(_v.y) > 1.3 || _v.z > 1) continue;
    _dist[k++] = Math.hypot((_v.x - cx) * 0.5 * ASP, (_v.y - cy) * 0.5);
  }
  const ds = _dist.subarray(0, k).sort();
  const R = Math.min(0.42, Math.max(0.05, 1.25 * (k ? ds[Math.floor(0.85 * (k - 1))] : 0.1)));
  const u = holo.uniforms, sw = swirlPhase(t);
  u.uC.value.set(cx * 0.5 + 0.5, cy * 0.5 + 0.5); u.uR.value = R;
  u.uRot.value = 0.06 * t + sw;                       // reticle spins with the swirl (same curve as the sound)
  u.uSpin.value = 6.2832 * sw;
  const hit = c => Math.exp(-(((t - c) / 0.12) ** 2));
  const swirl = clamp01((t - SW0) / (SW1 - SW0));
  u.uCA.value = 0.0015 + 0.005 * swirl * swirl * (t < T_FREEZE ? 1 : 0) + 0.006 * (hit(T_HOPF0) + hit(T_SNAP) + hit(T_SWAP1) + hit(T_END));
  u.uHud.value = s.fade * smooth(seg(t, 2.5, 4.5))
                 * (1 - 0.9 * smooth(seg(t, T_FREEZE, T_FREEZE + 0.2)) * (1 - smooth(seg(t, T_SNAP, T_SNAP + 0.15))))
                 * (1 - 0.6 * smooth(seg(t, T_SNAP + 0.6, 27)));
  u.uBr.value = s.fade * smooth(seg(t, 0.8, 2.2));
  u.uVis.value = matte.uniforms.uVis.value;
  u.uSw.value = -1;
  for (const c of [0.9, T_HOPF0, T_SNAP]) if (t >= c && t < c + 0.5) u.uSw.value = 1 - (t - c) / 0.5;   // scan sweeps, top to bottom
}
/** visible aspect ratio at time t inside the 1.43:1 frame (IMAX "expanded aspect ratio").
 *  Real IMAX releases switch with a hard cut, never a slide: 1.90:1 for the quiet arrival,
 *  full 1.43:1 from the Hopf flow on, when the nine turns inside out and the trails fill the sky. */
function imaxMatte(t) {
  return t < T_HOPF0 ? MATTE_ASP : 1.43;
}
window.renderAt = renderAt;
// debug: screen-space (NDC) bounding box of the main curve at time t
window.__bbox = t => { renderAt(t); const v = new THREE.Vector3(); let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
  for (let i = 0; i < N; i += 3) { v.set(pos[3*i], pos[3*i+1], pos[3*i+2]).project(camera);
    if (Math.abs(v.x) > 3 || Math.abs(v.y) > 3) continue; x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
  return [x0, x1, y0, y1].map(q => +q.toFixed(3)); };
window.DURATION = DURATION;
window.__ready = true;

if (!RENDER) {
  let t = +qs.get('t') || 0, playing = true, last = performance.now();
  const scrub = document.getElementById('scrub'), tl = document.getElementById('tl'), btn = document.getElementById('play');
  scrub.oninput = () => { t = +scrub.value; };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'pause' : 'play'; };
  (function loop(now) {
    if (playing) t = (t + (now - last) / 1000) % DURATION;
    last = now; scrub.value = t; tl.textContent = t.toFixed(2) + ' s';
    renderAt(t); requestAnimationFrame(loop);
  })(last);
  addEventListener('resize', () => location.reload());
}
</script>
