
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csrp"
version = "0.0.1"
authors = [
  { name="Gemini", email="gemini@google.com" },
]
description = "Cognitive Systems Research Platform"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-benchmark",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_kernel*", "sdk*"]
namespaces = false
